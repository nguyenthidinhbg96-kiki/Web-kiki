<script>
function normalizeData(arr){
  return (arr || []).map(v => {

    let vi = "";
    let en = "";

    const text = (v.kanji || v.kana || "");

    const isVerb = text.includes("ます");

    const isPronoun =
      ["私","あなた","あの人","あの方"].includes(v.kanji) ||
      ["わたし","あなた"].includes(v.kana);

    const isQuestion =
      ["だれ","どなた","なんさい","おいくつ"].includes(v.kana);

    const isSuffix =
      ["さん","ちゃん","人","歳"].some(x => text.includes(x));

    if (isPronoun) {
      vi = "Đại từ nhân xưng";
      en = "Pronoun";
    } else if (isQuestion) {
      vi = "Từ để hỏi";
      en = "Question word";
    } else if (isSuffix) {
      vi = "Từ / hậu tố đặc biệt";
      en = "Suffix / Special term";
    } else if (isVerb) {
      vi = "Động từ (dạng ます)";
      en = "Verb (masu-form)";
    } else {
      vi = "Danh từ / Từ vựng cơ bản";
      en = "Noun / Basic vocabulary";
    }

    return {
      ...v,
      word_type_vi: v.word_type_vi || vi,
      word_type_en: v.word_type_en || en
    };
  });
}

<script>

    u.lang = lang;

const lessons = [];
let showFurigana = true;
for(let i=1;i<=25;i++){
lessons.push({

title:`Bài ${i}`
});
}
const lessonGrid = document.getElementById("lessonGrid");

function openCategory(type){

  document.getElementById("categoryPage").style.display = "none";
  document.getElementById("lessonPage").style.display = "block";

  if(type === "minna"){
    renderLessons(lessons);
  }

  if(type === "topic"){

  }
}

function backToCategory(){

  document.getElementById("categoryPage").style.display = "block";
}

function renderLessons(data){

lessonGrid.innerHTML="";

data.forEach(item=>{

lessonGrid.innerHTML+=`
<div class="lesson-card"
onclick="openLesson(${item.lesson})">

<div class="lesson-number">
Bài ${item.lesson}
</div>

<div class="lesson-title">
Lesson ${item.lesson}
</div>

</div>
`;

});

}

function openLesson(lesson){

  const data = window.N5_DATA?.[lesson] || [];

  if(!Array.isArray(data)){
    console.error("DATA NOT LOADED");
    return;
  }

const vocabData = data.filter(v => Number(v.lesson) === Number(lesson));

  document.getElementById("lessonTitle").innerHTML = `
  <div>
    <div style="font-size:18px;font-weight:800;color:#ff4f87;">
      Bài ${lesson}
    </div>
    <div style="font-size:12px;color:#999;font-weight:500;">
      Lesson ${lesson}
    </div>
  </div>
`;

  const vocabList = document.getElementById("vocabList");

  if(vocabData.length === 0){
    vocabList.innerHTML = "<p>Chưa có dữ liệu</p>";
    return;
  }

  vocabList.innerHTML = vocabData.map((v,index)=>`
  <div class="vocab-card"
    style="position:relative;"
    onclick="toggleDetail(${v.id || index},
    '${v.kanji || v.kana}',
    '${v.example_read || ""}')">

      <!-- ➕ BUTTON -->
      <button class="icon-btn"
        onclick="event.stopPropagation();toggleMenu(${v.id || index})">
        ➕
      </button>

      <!-- ⚙️ BUTTON -->
      <button class="icon-btn"
        onclick="event.stopPropagation();openSpeedPopup()">
        ⚙️
      </button>

      <!-- MENU -->
      <div class="note-menu" id="menu-${v.id || index}">
        <button onclick="addToNotebook('new', ${v.id || index})">
          📘 Thêm sổ tay mới
        </button>
        <button onclick="addToNotebook('exist', ${v.id || index})">
          📂 Thêm sổ tay có sẵn
        </button>
      </div>

    </div>

    <div class="vocab-top">
      <div class="vocab-id">${index + 1}.</div>

      <div class="vocab-main">

        <div class="jp">
          ${v.kanji || v.kana}
          <span class="play"
            onclick="event.stopPropagation();TTS.play('${v.kanji || v.kana}','ja-JP')">
            🔊
          </span>
        </div>

        <div class="reading">${v.kana || ""}</div>

        <div class="hanviet">${v.hanviet || ""}</div>

        <div class="meaning">
          🇻🇳 ${v.vi || ""}
          <span class="play"
            onclick="event.stopPropagation();TTS.play('${v.vi}','vi-VN')">
            🔊
          </span>
        </div>

        <div class="meaning">
          🇬🇧 ${v.en || ""}
          <span class="play"
            onclick='event.stopPropagation();TTS.play(${JSON.stringify(v.en || "")},"en-US")'>
            🔊
          </span>
        </div>
        <br>
<!-- 🔥 THÊM Ở ĐÂY (trước example) -->
  <div class="word-type">
    <div class="word-type-vi">${v.word_type_vi || ""}</div>
    <div class="word-type-en">${v.word_type_en || ""}</div>
  </div>

      </div>
    </div>

    <div class="detail"
      id="detail-${v.id}"
      onclick="event.stopPropagation()">

      ${renderExample(v)}

      <div class="example-vi">
        ${v.example_vi || ""}
        <span class="play"
          onclick="event.stopPropagation();TTS.play('${v.example_vi || ""}','vi-VN')">
          🔊
        </span>
      </div>

      <div class="example-en">
        ${v.example_en || ""}
        <span class="play"
          onclick="event.stopPropagation();TTS.play('${v.example_en || ""}','en-US')">
          🔊

  document.getElementById("modal").style.display = "flex";

// thêm từ vào sổ tay
function addToNotebook(type, wordId){

  wordId = String(wordId);

  if(type === "new"){
    const name = prompt("Tên sổ tay mới:");
    if(!name) return;

    if(!notebooks[name]){
      notebooks[name] = [];
    }

    if(!notebooks[name].includes(wordId)){
      notebooks[name].push(wordId);
    }

    saveNotebooks();
    openNotebooks();
    alert("Đã thêm vào sổ tay: " + name);
  }

  if(type === "exist"){
    const names = Object.keys(notebooks);

    if(names.length === 0){
      alert("Chưa có sổ tay nào!");
      return;
    }

    const name = prompt("Chọn sổ tay:\n\n" + names.join("\n"));

    if(!name || !notebooks[name]){
      alert("Không tồn tại!");
      return;
    }

    if(!notebooks[name].includes(wordId)){
      notebooks[name].push(wordId);
      saveNotebooks();
    }

    alert("Đã thêm vào: " + name);
  }
}

function openNotebook(name){

  const ids = notebooks[name];

  const data = Object.values(window.N5_DATA || {}).flat();

  const words = data.filter(v =>
  ids.includes(String(v.id))
);

  alert(
    "📘 " + name + "\n\n" +
    words.map(w => w.kanji + " - " + w.vi).join("\n")
  );
}

//=========================
// AUTO PLAY ENGINE V2
//=========================

let autoPlaying = false;
let autoPaused = false;

let autoCards = [];
let autoCardIndex = 0;

let autoVoiceQueue = [];
let autoVoiceIndex = 0;

let autoMode = "all";

function openAutoPlay(){

    document.getElementById("autoPlayPopup").style.display="flex";

}

function closeAutoPlay(){

    document.getElementById("autoPlayPopup").style.display="none";

}

function startAutoPlay(){

    speechSynthesis.cancel();

    autoMode =
    document.querySelector('input[name="autoMode"]:checked').value;

    speechRate =
    Number(document.querySelector('input[name="autoSpeed"]:checked').value);

    autoCards =
    [...document.querySelectorAll(".vocab-card")];

    autoCardIndex = 0;

    autoPlaying = true;

    autoPaused = false;

    closeAutoPlay();

    playCurrentCard();

}

function stopAutoPlay(){

    autoPlaying=false;

    autoPaused=false;

    speechSynthesis.cancel();

}

function pauseAutoPlay(){

    autoPaused=true;

    speechSynthesis.pause();

}

function resumeAutoPlay(){

    autoPaused=false;

    speechSynthesis.resume();

}

function playCurrentCard(){

    if(!autoPlaying) return;

    if(autoCardIndex>=autoCards.length){

        stopAutoPlay();

        alert("Đã phát xong.");

        return;

    }

    document.querySelectorAll(".detail").forEach(d=>{

        d.style.display="none";

    });

    const card=autoCards[autoCardIndex];

    const detail=card.querySelector(".detail");

    if(detail){

        detail.style.display="block";

    }

    card.scrollIntoView({

        behavior:"smooth",

        block:"center"

    });

    const jp =
    card.querySelector(".jp")?.innerText
    .replace("🔊","")
    .trim() || "";

    const vi =
    card.querySelectorAll(".meaning")[0]?.innerText
    .replace("🇻🇳","")
    .replace("🔊","")
    .trim() || "";

    const en =
    card.querySelectorAll(".meaning")[1]?.innerText
    .replace("🇬🇧","")
    .replace("🔊","")
    .trim() || "";

    const exjp =
    card.querySelector(".example-kana")?.innerText.trim() || "";

    const exvi =
    card.querySelector(".example-vi")?.innerText
    .replace("🇻🇳","")
    .replace("🔊","")
    .trim() || "";

    const exen =
    card.querySelector(".example-en")?.innerText
    .replace("🇬🇧","")
    .replace("🔊","")
    .trim() || "";

    autoVoiceQueue=[];

    switch(autoMode){

        case "jp":

            autoVoiceQueue.push({
                text:jp,
                lang:"ja-JP"
            });

        break;

        case "vi":

            autoVoiceQueue.push({
                text:vi,
                lang:"vi-VN"
            });

        break;

        case "en":

            autoVoiceQueue.push({
                text:en,
                lang:"en-US"
            });

        break;

        case "jpvi":

            autoVoiceQueue.push({
                text:jp,
                lang:"ja-JP"
            });

            autoVoiceQueue.push({
                text:vi,
                lang:"vi-VN"
            });

        break;

        case "jpen":

            autoVoiceQueue.push({
                text:jp,
                lang:"ja-JP"
            });

            autoVoiceQueue.push({
                text:en,
                lang:"en-US"
            });

        break;

        default:

            autoVoiceQueue.push({text:jp,lang:"ja-JP"});

            autoVoiceQueue.push({text:vi,lang:"vi-VN"});

            autoVoiceQueue.push({text:en,lang:"en-US"});

            if(exjp){

                autoVoiceQueue.push({
                    text:exjp,
                    lang:"ja-JP"
                });

            }

            if(exvi){

                autoVoiceQueue.push({
                    text:exvi,
                    lang:"vi-VN"
                });

            }

            if(exen){

                autoVoiceQueue.push({
                    text:exen,
                    lang:"en-US"
                });

            }

    }

    autoVoiceIndex=0;

    playVoiceQueue();

}

function playVoiceQueue(){

    if(!autoPlaying) return;

    if(autoPaused) return;

    if(autoVoiceIndex >= autoVoiceQueue.length){

        autoCardIndex++;

        setTimeout(playCurrentCard,500);

        return;

    }

    const item = autoVoiceQueue[autoVoiceIndex];

    // dùng chung engine với nút loa
    TTS.play(item.text,item.lang);

    // thời gian chờ dựa theo độ dài câu
    let wait =
    Math.max(
        1200,
        item.text.length * 180 / speechRate
    );

    autoVoiceIndex++;

    setTimeout(()=>{

        playVoiceQueue();

    },wait);

}
