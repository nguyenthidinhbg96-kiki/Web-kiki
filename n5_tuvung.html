<!DOCTYPE html>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Be Vietnam Pro',sans-serif;
background:linear-gradient(135deg,#ffe6ef,#fff1e6);
padding:10px;

}

/* HEADER */

.header{
display:flex;
align-items:center;
padding:10px 16px;
background:linear-gradient(135deg,#ff4f87,#ff9a6c);
border-radius:14px;
margin-bottom:12px;
color:white;
box-shadow:0 4px 10px rgba(0,0,0,.15);
}

.header-icon{

margin-right:10px;
}

.header-title{
font-size:24px;
font-weight:800;
}

.header-subtitle{
font-size:12px;

}

/* BUTTONS */

.nav-buttons{
display:flex;
gap:10px;
margin-bottom:12px;
}

.nav-buttons button{
border:none;
padding:8px 14px;
border-radius:10px;
background:#ff9a6c;
color:white;

}

/* SEARCH */
.search-box{
  position:relative;
  margin-bottom:12px;
}

.search-box input{
  width:100%;
  padding:10px 12px 10px 38px;

  border:1px solid #d2691e;

}

}

#modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

.modal-header{

background:#fff8f4;

.jp{
font-size:22px;
font-weight:800;
color:#ff4f87;
}

.reading{
font-size:14px;
color:#666;
margin-top:3px;
}

.vi{
font-size:14px;
margin-top:5px;
}
.vocab-card{

border-radius:12px;

.vocab-card:hover{

.vocab-top{

ruby{

.divider{

}

.speed-box{

.speed-close{

.speed-close:hover{

.speed-title{

.speed-option{

  padding:8px 0;

}

.speed-subtitle{
  font-size:12px;

  margin-top:2px;
}
.card-setting.toolbar{
  position:absolute;
  top:6px;
  right:6px;
  display:flex;
  gap:4px;
}
.card-actions{
  position:absolute;
  top:6px;
  right:6px;
  display:flex;
  gap:6px;

}

.icon-btn{
  width:26px;
  height:26px;
  border:none;

  background:white;

}

.note-menu{
  position:absolute;
  top:36px;

  border:1px solid #ffd7c2;

.note-menu button{

</style>

<body>

<div class="header">
<div class="header-icon">📚</div>

<div>
<div class="header-title">N5 Từ Vựng</div>

</div>
</div>

<div class="nav-buttons">

">

    Back

</div>

<!-- MODAL -->

<div class="modal-content">

<div class="modal-title" id="lessonTitle"></div>

<div style="display:flex;gap:8px;">

<div
class="popup-close"
onclick="closeModal()">
✕
</div>

</div>

<script src="n5_tuvung_data_1.js"></script>
<script src="n5_tuvung_data_2.js"></script>
<script>
  const TTS = {
  play(text, lang = "ja-JP") {

    if (!text) return;

    const u = new SpeechSynthesisUtterance(text);

    u.lang = lang;
    u.volume = 1;

    // 🔥 quan trọng: lấy speed từ settings
    u.rate = speechRate;

    u.pitch = 1;

    speechSynthesis.cancel();

    setTimeout(() => {
      speechSynthesis.speak(u);
    }, 50);
  }
};

const lessons = [];
let showFurigana = true;
for(let i=1;i<=25;i++){
lessons.push({
lesson:i,
title:`Bài ${i}`
});
}
const lessonGrid = document.getElementById("lessonGrid");

function openCategory(type){

  document.getElementById("categoryPage").style.display = "none";
  document.getElementById("lessonPage").style.display = "block";

  if(type === "minna"){
    renderLessons(lessons);
  }

  if(type === "topic"){
    alert("Từ vựng chủ đề: chưa có dữ liệu");
  }
}

function backToCategory(){
  document.getElementById("lessonPage").style.display = "none";
  document.getElementById("categoryPage").style.display = "block";
}

function renderLessons(data){

lessonGrid.innerHTML="";

data.forEach(item=>{

lessonGrid.innerHTML+=`
<div class="lesson-card"
onclick="openLesson(${item.lesson})">

<div class="lesson-number">
Bài ${item.lesson}
</div>

<div class="lesson-title">
Lesson ${item.lesson}
</div>

</div>
`;

});

}

function openLesson(lesson){

  const data = [
    ...(window.n5_tuvung_data_1 || []),
    ...(window.n5_tuvung_data_2 || [])
  ];

  if(!Array.isArray(data)){
    console.error("DATA NOT LOADED");
    return;
  }

const vocabData = data.filter(v => Number(v.lesson) === Number(lesson));

  document.getElementById("lessonTitle").innerHTML = `
  <div>
    <div style="font-size:18px;font-weight:800;color:#ff4f87;">
      Bài ${lesson}
    </div>
    <div style="font-size:12px;color:#999;font-weight:500;">
      Lesson ${lesson}
    </div>
  </div>
`;

  const vocabList = document.getElementById("vocabList");

  if(vocabData.length === 0){
    vocabList.innerHTML = "<p>Chưa có dữ liệu</p>";
    return;
  }

  vocabList.innerHTML = vocabData.map((v,index)=>`
  <div class="vocab-card"
    style="position:relative;"
    onclick="toggleDetail(${v.id || index},
    '${v.kanji || v.kana}',
    '${v.example_read || ""}')">

    <!-- ACTION BUTTONS -->
    <div class="card-actions">

      <!-- ➕ BUTTON -->
      <button class="icon-btn"
        onclick="event.stopPropagation();toggleMenu(${v.id || index})">
        ➕
      </button>

      <!-- ⚙️ BUTTON -->
      <button class="icon-btn"
        onclick="event.stopPropagation();openSpeedPopup()">
        ⚙️
      </button>

      <!-- MENU -->
      <div class="note-menu" id="menu-${v.id || index}">
        <button onclick="addToNotebook('new', ${v.id || index})">
          📘 Thêm sổ tay mới
        </button>
        <button onclick="addToNotebook('exist', ${v.id || index})">
          📂 Thêm sổ tay có sẵn
        </button>
      </div>

    </div>

    <div class="vocab-top">
      <div class="vocab-id">${index + 1}.</div>

      <div class="vocab-main">

        <div class="jp">
          ${v.kanji || v.kana}
          <span class="play"
            onclick="event.stopPropagation();TTS.play('${v.kanji || v.kana}','ja-JP')">
            🔊
          </span>
        </div>

        <div class="reading">${v.kana || ""}</div>

        <div class="hanviet">${v.hanviet || ""}</div>

        <div class="meaning">
          🇻🇳 ${v.vi || ""}
          <span class="play"
            onclick="event.stopPropagation();TTS.play('${v.vi}','vi-VN')">
            🔊
          </span>
        </div>

        <div class="meaning">
          🇬🇧 ${v.en || ""}
          <span class="play"
            onclick='event.stopPropagation();TTS.play(${JSON.stringify(v.en || "")},"en-US")'>
            🔊
          </span>
        </div>

      </div>
    </div>

    <div class="detail"
      id="detail-${v.id}"
      onclick="event.stopPropagation()">

      ${renderExample(v)}

      <div class="example-vi">
        ${v.example_vi || ""}
        <span class="play"
          onclick="event.stopPropagation();TTS.play('${v.example_vi || ""}','vi-VN')">
          🔊
        </span>
      </div>

      <div class="example-en">
        ${v.example_en || ""}
        <span class="play"
          onclick="event.stopPropagation();TTS.play('${v.example_en || ""}','en-US')">
          🔊
        </span>
      </div>

      <div class="divider"></div>
      <div class="level">JLPT ${v.level || ""}</div>

    </div>

  </div>
`).join("");

  document.getElementById("modal").style.display = "flex";
}
function closeModal(){

document.getElementById("modal").style.display="none";

}

document
.getElementById("search")
.addEventListener("input",e=>{

const key =
e.target.value.toLowerCase();

renderLessons(

lessons.filter(x=>

x.title.toLowerCase().includes(key)

)

);

});

renderLessons(lessons);
function toggleDetail(id, word="", example=""){

  const el = document.getElementById("detail-" + id);

  if(!el) return;

  const opening = el.style.display !== "block";

  el.style.display =
    opening ? "block" : "none";

  if(opening){

    speechSynthesis.cancel();

    setTimeout(() => {

      TTS.play(word,"ja-JP");

      if(example){

        setTimeout(() => {
          TTS.play(example,"ja-JP");
        },1500);

      }

    },100);

  }

}

function renderExample(v){

  let html = v.example || "";

  return `
    <div class="example-wrap">

      <button class="furi-toggle"
        onclick="toggleExampleFurigana(this,event)">
        OFF
      </button>

<div class="example-jp">
  ${html}

<span class="play"
onclick="event.stopPropagation();TTS.play('${v.example_read || v.example_kana || ""}','ja-JP')">
🔊
</span>
</div>

      <div class="example-kana">
        ${v.example_kana || ""}
      </div>
      

    </div>
  `;
}
function toggleExampleFurigana(btn, e) {
  e.stopPropagation();

  const wrap = btn.closest(".example-wrap");

  wrap.classList.toggle("hide-furi");

  if (wrap.classList.contains("hide-furi")) {
    btn.innerText = "ON";
  } else {
    btn.innerText = "OFF";
  }
}

function closeAllPopups(){
  document.getElementById("modal").style.display = "none";
}
speechSynthesis.onvoiceschanged = () => {
  console.log("voices loaded:", speechSynthesis.getVoices());
};

function testVoice(){

  const u = new SpeechSynthesisUtterance("こんにちは");

  u.lang = "ja-JP";

  speechSynthesis.speak(u);

}
// ===== SETTINGS SPEED SYSTEM (FULL COPY FILE 2) =====

let speechRate = 1;

// mở popup
function openSpeedPopup(){
  document.getElementById("speedPopup").style.display = "flex";
}

// đóng popup
function closeSpeedPopup(){
  document.getElementById("speedPopup").style.display = "none";
}

// thay đổi speed
document.addEventListener("change", function(e){
  if(e.target.name === "speed"){
    speechRate = Number(e.target.value);
    localStorage.setItem("tts_speed", speechRate);
  }
});

// load speed đã lưu
const savedSpeed = localStorage.getItem("tts_speed");

if(savedSpeed){
  speechRate = Number(savedSpeed);

  const radio = document.querySelector(
    `input[name="speed"][value="${savedSpeed}"]`
  );

  if(radio){
    radio.checked = true;
  }
}
function toggleMenu(id){
  const menu = document.getElementById("menu-" + id);

  if(!menu) return;

  // đóng tất cả menu khác
  document.querySelectorAll(".note-menu").forEach(m=>{
    if(m.id !== "menu-"+id) m.style.display = "none";
  });

  menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

// click ngoài để đóng menu
document.addEventListener("click", ()=>{
  document.querySelectorAll(".note-menu").forEach(m=>{
    m.style.display = "none";
  });
});

let notebooks = JSON.parse(localStorage.getItem("notebooks") || "{}");

// Lưu lại
function saveNotebooks(){
  localStorage.setItem("notebooks", JSON.stringify(notebooks));
}

// thêm từ vào sổ tay
function addToNotebook(type, wordId){

  wordId = String(wordId);

  if(type === "new"){
    const name = prompt("Tên sổ tay mới:");
    if(!name) return;

    if(!notebooks[name]){
      notebooks[name] = [];
    }

    if(!notebooks[name].includes(wordId)){
      notebooks[name].push(wordId);
    }

    saveNotebooks();
    openNotebooks();
    alert("Đã thêm vào sổ tay: " + name);
  }

  if(type === "exist"){
    const names = Object.keys(notebooks);

    if(names.length === 0){
      alert("Chưa có sổ tay nào!");
      return;
    }

    const name = prompt("Chọn sổ tay:\n\n" + names.join("\n"));

    if(!name || !notebooks[name]){
      alert("Không tồn tại!");
      return;
    }

    if(!notebooks[name].includes(wordId)){
      notebooks[name].push(wordId);
      saveNotebooks();
    }

    alert("Đã thêm vào: " + name);
  }
}
function openNotebooks(){
  document.getElementById("categoryPage").style.display = "none";
  document.getElementById("lessonPage").style.display = "none";
  document.getElementById("notebookPage").style.display = "block";

  const list = document.getElementById("notebookList");
  const names = Object.keys(notebooks);

  if(names.length === 0){
    list.innerHTML = "<p>Chưa có sổ tay nào</p>";
    return;
  }

  list.innerHTML = names.map(name=>`
    <div class="lesson-card" onclick="openNotebook('${name}')">
      📘 ${name}
      <br>
      <small>${notebooks[name].length} từ</small>
    </div>
  `).join("");
}
function openNotebook(name){

  const ids = notebooks[name];

  const data = window.n5_tuvung_data_1;

  const words = data.filter(v =>
  ids.includes(String(v.id))
);

  alert(
    "📘 " + name + "\n\n" +
    words.map(w => w.kanji + " - " + w.vi).join("\n")
  );
}
</script>
<!-- SPEED SETTINGS POPUP -->
<div id="speedPopup" class="speed-popup">
  <div class="speed-box">

    <div class="speed-close" onclick="closeSpeedPopup()">✕</div>

    <div class="speed-title">
      ⚙️ Tốc độ đọc
